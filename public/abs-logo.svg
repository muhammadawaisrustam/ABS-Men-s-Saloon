<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="ABS Men's Salon">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;family=Montserrat:wght@700&amp;display=swap');
    </style>
    <linearGradient id="abs-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="0.45" stop-color="#d9a934"/>
      <stop offset="1" stop-color="#a5761b"/>
    </linearGradient>
  </defs>

  <!-- rings -->
  <circle cx="200" cy="200" r="194" fill="none" stroke="url(#abs-gold)" stroke-width="2.5"/>
  <path d="M 66 268 A 144 144 0 1 1 336 262" fill="none" stroke="url(#abs-gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- straight razor (behind) -->
  <g fill="url(#abs-gold)" transform="rotate(18 330 165)">
    <rect x="322" y="150" width="16" height="96" rx="8"/>
    <path d="M 322 150 L 322 88 C 322 80 330 76 338 80 L 350 86 L 338 150 Z" opacity="0.9"/>
  </g>
  <!-- scissors -->
  <g fill="none" stroke="url(#abs-gold)" stroke-width="5" stroke-linecap="round">
    <path d="M 312 84 L 292 186"/>
    <path d="M 286 86 L 306 186"/>
    <circle cx="288" cy="202" r="11"/>
    <circle cx="312" cy="200" r="11"/>
  </g>
  <circle cx="299" cy="140" r="3.5" fill="#111"/>

  <g transform="translate(-30 -24) scale(1.12)">
    <!-- shoulders and collar -->
    <g fill="none" stroke="url(#abs-gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 96 286 C 116 258 150 244 190 236"/>
      <path d="M 252 230 C 276 238 292 248 302 262"/>
      <path d="M 192 214 L 190 236 L 204 250 L 214 232"/>
      <path d="M 238 222 L 240 230 L 248 246 L 252 230"/>
    </g>

    <g fill="url(#abs-gold)">
      <!-- hair quiff -->
      <path d="M 166 146 C 156 118 160 90 180 74 C 198 60 226 56 248 66 C 268 76 270 92 262 102 C 256 110 250 114 246 116 C 232 108 210 108 196 114 C 186 120 182 132 180 146 Z"/>
      <!-- beard (sideburn, jaw, chin, up to mouth, cheek line back) -->
      <path d="M 180 142 C 178 168 184 196 202 214 C 214 224 230 228 242 226 C 252 224 258 214 258 204 L 256 192 L 250 192 C 246 196 240 196 236 192 C 234 186 230 180 222 174 C 212 166 202 158 198 140 Z"/>
      <!-- moustache -->
      <path d="M 232 178 C 240 172 252 172 262 177 C 260 184 252 186 246 183 C 240 186 234 184 232 178 Z"/>
      <!-- sunglasses -->
      <path d="M 228 128 L 256 128 C 258 141 254 151 244 153 C 233 154 228 146 228 128 Z"/>
      <path d="M 196 128 L 222 128 C 223 144 218 153 208 153 C 198 152 195 143 196 128 Z"/>
      <rect x="220" y="127" width="10" height="4" rx="2"/>
      <rect x="170" y="128" width="28" height="4" rx="2"/>
    </g>

    <g fill="none" stroke="url(#abs-gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- face profile: forehead, brow, nose, lip -->
      <path d="M 248 114 C 252 120 256 126 257 132"/>
      <path d="M 257 152 C 262 160 268 166 270 172 C 266 176 262 176 258 175"/>
      <path d="M 254 190 C 257 192 258 196 257 200"/>
      <!-- ear -->
      <path d="M 176 140 C 164 134 158 148 162 162 C 165 172 170 176 178 174"/>
    </g>

    <!-- dark detail lines: hair strands, lens shine, beard texture, mouth -->
    <g fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round">
      <path d="M 176 124 C 180 98 196 82 224 74"/>
      <path d="M 190 114 C 198 96 216 84 244 82"/>
      <path d="M 204 110 C 216 98 232 92 256 94"/>
      <path d="M 234 134 L 242 147"/>
      <path d="M 202 134 L 210 147"/>
      <path d="M 192 176 C 196 194 206 208 222 216"/>
      <path d="M 204 182 C 210 196 220 206 236 212"/>
      <path d="M 168 150 C 166 156 168 164 172 168"/>
      <path d="M 240 188 L 252 188"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="200" y="326" text-anchor="middle" font-family="'Kaushan Script', 'Brush Script MT', cursive" font-size="108" fill="url(#abs-gold)" stroke="#0f0f0f" stroke-width="6" paint-order="stroke">ABS</text>
  <text x="200" y="362" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="3" fill="url(#abs-gold)">MEN'S SALON</text>
</svg>
